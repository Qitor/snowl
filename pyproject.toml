[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowl"
version = "0.1.0"
description = "Snowl: a general agent evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.25",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.0.0",
  "twine>=5.0.0",
]
safety_assets = [
  "datasets<4.7.0",
  "huggingface_hub>=0.24",
]
osworld_eval = [
  "beautifulsoup4",
  "borb",
  "cssselect",
  "easyocr",
  "imagehash",
  "librosa",
  "lxml",
  "mutagen",
  "numpy",
  "odfpy",
  "opencv-python-headless",
  "openpyxl",
  "pandas",
  "pdfplumber",
  "pillow",
  "playwright",
  "pydrive",
  "pymupdf",
  "pypdf",
  "pypdf2",
  "python-docx",
  "python-pptx",
  "pyacoustid",
  "pytz",
  "rapidfuzz",
  "requests-toolbelt",
  "scikit-image",
  "tldextract>=5.3.0",
  "xmltodict",
]

[project.scripts]
snowl = "snowl.cli:main"

[project.urls]
Homepage = "https://github.com/Qitor/snowl"
Repository = "https://github.com/Qitor/snowl"
Issues = "https://github.com/Qitor/snowl/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["snowl", "snowl.*"]

[tool.setuptools.package-data]
"snowl" = ["_webui/**", "_webui/**/*"]
"snowl.benchmarks.strongreject" = ["data/*.csv"]
"snowl.ui" = ["panel_configs/*.yml", "panel_configs/*.yaml", "panel_configs/README.md"]

[tool.setuptools.exclude-package-data]
"snowl" = [
  "_webui/node_modules/**",
  "_webui/node_modules/**/*",
  "_webui/.snowl/**",
  "_webui/.snowl/**/*",
  "_webui/.next/cache/**",
  "_webui/.next/cache/**/*",
  "_webui/**/*.tsbuildinfo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".snowl",
  ".pytest_cache",
  "__pycache__",
  "build",
  "dist",
  "references",
  "webui/.next",
  "snowl/_webui/.next",
]
