[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowl"
version = "0.1.0"
description = "Snowl: a general agent evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=13.7",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7",
  "mkdocstrings>=1.0",
  "mkdocstrings-python>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-rerunfailures>=14.0",
  "pytest-timeout>=2.3",
  "build>=1.0.0",
  "twine>=5.0.0",
]
safety_assets = [
  "datasets<4.7.0",
  "huggingface_hub>=0.24",
]
qitos = [
  "qitos>=0.4.0",
]
langgraph = [
  "langgraph>=0.2.0",
]
openai = [
  "openai-agents>=0.1.0",
]
all = [
  "snowl[qitos,langgraph,openai]",
  "snowl-evals>=0.1.0",
]
osworld_eval = [
  "beautifulsoup4",
  "borb",
  "cssselect",
  "easyocr",
  "imagehash",
  "librosa",
  "lxml",
  "mutagen",
  "numpy",
  "odfpy",
  "opencv-python-headless",
  "openpyxl",
  "pandas",
  "pdfplumber",
  "pillow",
  "playwright",
  "pydrive",
  "pymupdf",
  "pypdf",
  "pypdf2",
  "python-docx",
  "python-pptx",
  "pyacoustid",
  "pytz",
  "rapidfuzz",
  "requests-toolbelt",
  "scikit-image",
  "tldextract>=5.3.0",
  "xmltodict",
]

[project.scripts]
snowl = "snowl.cli:main"

[project.entry-points."snowl.adapters"]
custom = "snowl.adapters.custom:CustomAdapter"
langgraph = "snowl.adapters.langgraph:LangGraphAdapter"
openai_agents = "snowl.adapters.openai_agents:OpenAIAgentsAdapter"
qitos = "snowl.adapters.qitos:QitOSAdapter"

[project.entry-points."snowl.environment_providers"]
docker = "snowl.envs.provider:DockerProvider"
local = "snowl.envs.provider:LocalProvider"

[project.entry-points."snowl.container_providers"]

[project.urls]
Homepage = "https://github.com/Qitor/snowl"
Repository = "https://github.com/Qitor/snowl"
Issues = "https://github.com/Qitor/snowl/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["snowl", "snowl.*"]

[tool.setuptools.package-data]
"snowl" = ["_webui/**", "_webui/**/*"]
"snowl.ui" = ["panel_configs/*.yml", "panel_configs/*.yaml", "panel_configs/README.md"]

[tool.setuptools.exclude-package-data]
"snowl" = [
  "_webui/node_modules/**",
  "_webui/node_modules/**/*",
  "_webui/.snowl/**",
  "_webui/.snowl/**/*",
  "_webui/.next/cache/**",
  "_webui/.next/cache/**/*",
  "_webui/**/*.tsbuildinfo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that call real LLM APIs (require SNOWL_LIVE_API_KEY, skipped by default)",
]
norecursedirs = [
  ".git",
  ".snowl",
  ".pytest_cache",
  "__pycache__",
  "build",
  "dist",
  "references",
  "webui/.next",
  "snowl/_webui/.next",
]
