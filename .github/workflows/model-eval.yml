name: Model Release Auto-Eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model ID to evaluate (e.g. gpt-4o, claude-3-opus)'
        required: false
        default: 'gpt-4o'
      benchmarks:
        description: 'Comma-separated benchmark names (e.g. cybench,humaneval,math)'
        required: false
        default: 'cybench,humaneval,math'
      limit:
        description: 'Max samples per benchmark (0 = all)'
        required: false
        default: '10'
  schedule:
    - cron: '3 6 * * 1'  # Weekly Monday 6:03am UTC

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Snowl
        run: pip install -e ".[dev]"

      - name: Run evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'gpt-4o' }}"
          BENCHMARKS="${{ github.event.inputs.benchmarks || 'cybench,humaneval,math' }}"
          LIMIT="${{ github.event.inputs.limit || '10' }}"

          IFS=',' read -ra BMK_ARRAY <<< "$BENCHMARKS"
          FAILED=0
          for bmk in "${BMK_ARRAY[@]}"; do
            bmk=$(echo "$bmk" | xargs)
            echo "=== Running benchmark: $bmk ==="
            LIMIT_FLAG=""
            if [ "$LIMIT" != "0" ]; then
              LIMIT_FLAG="--limit $LIMIT"
            fi
            if ! snowl bench run "$bmk" --model "$MODEL" $LIMIT_FLAG; then
              echo "::warning::Benchmark $bmk failed"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "failed_benchmarks=$FAILED" >> "$GITHUB_ENV"

      - name: Publish to leaderboard
        if: always()
        run: |
          PUBLISHED=0
          for dir in .snowl/runs/*/; do
            if [ -d "$dir" ] && [ -f "${dir}outcomes.json" ]; then
              echo "Publishing: $dir"
              if snowl leaderboard publish "$dir"; then
                PUBLISHED=$((PUBLISHED + 1))
              else
                echo "::warning::Failed to publish $dir"
              fi
            else
              echo "Skipping (no outcomes.json): $dir"
            fi
          done
          echo "published=$PUBLISHED" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          echo "## Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed benchmarks: ${failed_benchmarks:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published to leaderboard: ${published:-0}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .snowl/runs/
          retention-days: 30
