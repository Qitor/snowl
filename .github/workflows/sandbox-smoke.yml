name: Sandbox Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Docker
        run: docker info

      - name: Install Snowl
        env:
          SNOWL_SKIP_WEBUI_BUILD: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run workspace smoke
        run: snowl eval examples/sandbox-coding-smoke/project.yml --no-web-monitor

      - name: Run Docker sandbox smoke
        env:
          SNOWL_RUN_DOCKER_SMOKE: "1"
        run: pytest -q tests/test_sandbox_docker_smoke.py
